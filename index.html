<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f1117">
<title>Kalisma</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#0f1117;--bg2:#181c27;--bg3:#1f2535;--border:#2a3045;
  --accent:#4f8eff;--green:#22c97a;--red:#ff5c5c;--orange:#ff9f43;--purple:#7c5cfc;
  --text:#e8eaf0;--text2:#8b91a8;--text3:#555e7a;
  --kunda:#4f8eff;--pape:#ff9f43;--amperus:#22c97a;--waat:#ff5c5c;
  --r:16px;--rs:10px;--sb:env(safe-area-inset-bottom,20px);--st:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overscroll-behavior:none;}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);max-width:430px;margin:0 auto;overflow-x:hidden;}
#login{position:fixed;inset:0;z-index:999;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px 24px;max-width:430px;margin:0 auto;}
.logo{font-size:40px;font-weight:700;letter-spacing:-1.5px;margin-bottom:4px;}
.logo span{color:var(--accent);}
.logo-sub{color:var(--text3);font-size:13px;margin-bottom:44px;}
.lcard{width:100%;background:var(--bg2);border:1px solid var(--border);border-radius:20px;padding:26px;}
.ltitle{font-size:17px;font-weight:600;margin-bottom:22px;text-align:center;color:var(--text2);}
.lerr{color:var(--red);font-size:13px;text-align:center;margin-top:10px;display:none;}
.fi{margin-bottom:14px;}
.fl{font-size:12px;font-weight:600;color:var(--text2);margin-bottom:6px;display:block;}
input,select,textarea{width:100%;background:var(--bg3);border:1.5px solid var(--border);border-radius:var(--rs);color:var(--text);font-family:'DM Sans',sans-serif;font-size:16px;padding:13px 14px;outline:none;transition:border-color .2s;-webkit-appearance:none;appearance:none;}
input:focus,select:focus,textarea:focus{border-color:var(--accent);}
textarea{resize:vertical;min-height:70px;font-size:15px;}
.fr{display:flex;gap:10px;}
.fr .fi{flex:1;}
.btn{width:100%;border:none;border-radius:var(--rs);padding:15px;font-family:'DM Sans',sans-serif;font-size:15px;font-weight:600;cursor:pointer;transition:opacity .15s;margin-top:6px;}
.btn:active{opacity:.8;}
.btn-p{background:var(--accent);color:#fff;}
.btn-g{background:var(--bg3);color:var(--text2);border:1px solid var(--border);}
.btn-d{background:rgba(255,92,92,.15);color:var(--red);border:1px solid rgba(255,92,92,.3);}
.btn-sm{background:var(--accent);color:#fff;border:none;border-radius:var(--rs);padding:11px 16px;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:600;cursor:pointer;}
.icon-btn{background:var(--accent);border:none;color:#fff;width:38px;height:38px;border-radius:50%;font-size:24px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;line-height:1;}
#app{display:none;min-height:100vh;}
#app.on{display:block;}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:rgba(15,17,23,.96);backdrop-filter:blur(24px);border-top:1px solid var(--border);display:flex;padding:10px 0 calc(10px + var(--sb));z-index:100;}
.nb{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;color:var(--text3);cursor:pointer;font-family:'DM Sans',sans-serif;font-size:10px;font-weight:500;transition:color .2s;padding:4px 0;}
.nb.on{color:var(--accent);}
.nb svg{width:22px;height:22px;}
.pg{display:none;padding-bottom:calc(80px + var(--sb));min-height:100vh;}
.pg.on{display:block;}
.hd{padding:calc(var(--st) + 54px) 20px 14px;background:linear-gradient(180deg,var(--bg2) 0%,transparent 100%);position:sticky;top:0;z-index:50;backdrop-filter:blur(20px);}
.hd h1{font-size:28px;font-weight:700;letter-spacing:-.5px;}
.hd p{color:var(--text2);font-size:13px;margin-top:2px;}
.hdr{display:flex;justify-content:space-between;align-items:flex-end;gap:8px;}
.ubadge{display:flex;align-items:center;gap:6px;background:var(--bg3);border:1px solid var(--border);border-radius:20px;padding:6px 12px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;flex-shrink:0;}
.stitle{font-size:11px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--text3);margin:20px 0 10px;}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:16px;margin-bottom:10px;position:relative;overflow:hidden;cursor:pointer;transition:transform .15s,border-color .15s;}
.card:active{transform:scale(.98);border-color:var(--accent);}
.cacc{position:absolute;left:0;top:0;bottom:0;width:3px;}
.badge{font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;white-space:nowrap;}
.ba{background:rgba(34,201,122,.1);color:var(--amperus);}
.bw{background:rgba(255,92,92,.1);color:var(--waat);}
.bd{background:rgba(255,255,255,.06);color:var(--text2);}
.bm{background:rgba(124,92,252,.15);color:var(--purple);}
.camts{display:flex;gap:8px;}
.ab{flex:1;background:var(--bg3);border-radius:var(--rs);padding:8px 10px;}
.al{font-size:10px;color:var(--text3);margin-bottom:2px;}
.av{font-size:14px;font-weight:600;font-family:'DM Mono',monospace;}
.av.g{color:var(--green);}
.av.r{color:var(--red);}
.krow{display:flex;gap:10px;margin-bottom:8px;}
.kcard{flex:1;background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:14px 12px;}
.kl{font-size:10px;color:var(--text3);margin-bottom:4px;font-weight:500;}
.kv{font-size:18px;font-weight:700;font-family:'DM Mono',monospace;}
.kv.a{color:var(--accent);}
.kv.g{color:var(--green);}
.kv.o{color:var(--orange);}
.cw{margin-bottom:6px;}
.cwl{font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:1px;margin:18px 0 10px;}
.cd{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);margin-bottom:8px;overflow:hidden;}
.cdh{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--border);}
.cdn{font-size:22px;font-weight:700;font-family:'DM Mono',monospace;}
.cdn.today{background:var(--accent);color:#fff;border-radius:8px;padding:2px 10px;}
.cdname{font-size:12px;color:var(--text2);font-weight:500;flex:1;}
.cde{padding:10px 14px;color:var(--text3);font-size:13px;font-style:italic;}
.ce{padding:10px 14px;border-top:1px solid var(--border);display:flex;gap:10px;align-items:flex-start;}
.ce.clickable{cursor:pointer;}
.ce.clickable:active{background:var(--bg3);}
.cdot{width:8px;height:8px;border-radius:50%;margin-top:5px;flex-shrink:0;}
.ci{flex:1;}
.ctech{font-size:11px;font-weight:700;margin-bottom:2px;}
.caddr{font-size:12px;color:var(--text2);line-height:1.4;}
.ccli{font-size:11px;font-weight:600;margin-top:3px;}
.absent-tag{display:inline-block;font-size:10px;font-weight:700;padding:2px 7px;border-radius:10px;margin-left:6px;}
.absent-tag.abs{background:rgba(255,92,92,.2);color:var(--red);}
.absent-tag.cng{background:rgba(255,159,67,.2);color:var(--orange);}
.dep-item{display:flex;align-items:center;gap:8px;padding:9px 12px;background:var(--bg3);border-radius:var(--rs);margin-bottom:6px;border:1px solid var(--border);}
.dep-info{flex:1;}
.dep-desc{font-size:13px;font-weight:500;}
.dep-date{font-size:11px;color:var(--text3);margin-top:1px;}
.dep-amt{font-size:14px;font-weight:700;font-family:'DM Mono',monospace;color:var(--orange);white-space:nowrap;}
.dep-del{background:none;border:none;color:var(--text3);cursor:pointer;padding:4px;font-size:16px;flex-shrink:0;}
.dep-total{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:rgba(255,159,67,.1);border:1px solid rgba(255,159,67,.25);border-radius:var(--rs);margin-top:4px;}
.abs-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:14px;margin-bottom:8px;}
.abs-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.abs-name{font-size:15px;font-weight:700;}
.abs-item{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--border);font-size:13px;}
.abs-item:last-child{border-bottom:none;}
.mo{display:none;position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.75);backdrop-filter:blur(6px);align-items:flex-end;justify-content:center;}
.mo.on{display:flex;}
.m{width:100%;max-width:430px;background:var(--bg2);border-radius:24px 24px 0 0;border-top:1px solid var(--border);max-height:94vh;overflow-y:auto;padding:20px 16px calc(24px + var(--sb));animation:su .3s cubic-bezier(.34,1.56,.64,1);}
@keyframes su{from{transform:translateY(100%);}to{transform:translateY(0);}}
.mh{width:36px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 22px;}
.mt{font-size:20px;font-weight:700;margin-bottom:18px;}
.toast{position:fixed;top:calc(var(--st) + 54px);left:50%;transform:translateX(-50%);padding:10px 22px;border-radius:20px;font-size:14px;font-weight:600;z-index:400;opacity:0;transition:opacity .3s;white-space:nowrap;pointer-events:none;}
.toast.on{opacity:1;}
.toast.ok{background:var(--green);color:#fff;}
.toast.err{background:var(--red);color:#fff;}
.sp{width:18px;height:18px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:rot .8s linear infinite;}
@keyframes rot{to{transform:rotate(360deg);}}
.pad{padding:0 16px;}
.sync-dot{width:8px;height:8px;border-radius:50%;background:var(--green);display:inline-block;margin-left:6px;animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}
.exp-row{display:flex;gap:8px;margin-bottom:12px;}
.exp-btn{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--rs);padding:11px 10px;color:var(--text2);font-family:'DM Sans',sans-serif;font-size:13px;font-weight:600;cursor:pointer;}
</style>
</head>
<body>
<div class="toast" id="toast"></div>
<div id="login">
  <div class="logo">Kali<span>sma</span></div>
  <div class="logo-sub">Gestion des chantiers · Temps réel</div>
  <div class="lcard">
    <div class="ltitle">Connexion</div>
    <div class="fi"><label class="fl">Identifiant</label>
      <input id="lu" type="text" placeholder="Votre prénom" autocomplete="username" autocapitalize="none" autocorrect="off">
    </div>
    <div class="fi"><label class="fl">Mot de passe</label>
      <input id="lp" type="password" placeholder="••••••••" autocomplete="current-password">
    </div>
    <button class="btn btn-p" onclick="doLogin()">Se connecter</button>
    <div class="lerr" id="lerr">Identifiant ou mot de passe incorrect</div>
  </div>
  <div style="margin-top:16px;font-size:11px;color:var(--text3);text-align:center;">
    <span class="sync-dot"></span> Synchronisation Firebase temps réel
  </div>
</div>
<!-- SUITE DANS PARTIE 2 -->
</body>
</html>
