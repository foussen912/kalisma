<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f1117">
<title>Kalisma</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f1117;--bg2:#181c27;--bg3:#1f2535;--border:#2a3045;--accent:#4f8eff;--green:#22c97a;--red:#ff5c5c;--orange:#ff9f43;--purple:#7c5cfc;--text:#e8eaf0;--text2:#8b91a8;--text3:#555e7a;--kunda:#4f8eff;--pape:#ff9f43;--amperus:#22c97a;--waat:#ff5c5c;--r:16px;--rs:10px;--sb:env(safe-area-inset-bottom,20px);--st:env(safe-area-inset-top,0px);}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overscroll-behavior:none;}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);max-width:430px;margin:0 auto;overflow-x:hidden;}
#login{position:fixed;inset:0;z-index:999;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px 24px;max-width:430px;margin:0 auto;}
.logo{font-size:40px;font-weight:700;letter-spacing:-1.5px;margin-bottom:4px;}.logo span{color:var(--accent);}
.logo-sub{color:var(--text3);font-size:13px;margin-bottom:44px;}
.lcard{width:100%;background:var(--bg2);border:1px solid var(--border);border-radius:20px;padding:26px;}
.ltitle{font-size:17px;font-weight:600;margin-bottom:22px;text-align:center;color:var(--text2);}
.lerr{color:var(--red);font-size:13px;text-align:center;margin-top:10px;display:none;}
.fi{margin-bottom:14px;}.fl{font-size:12px;font-weight:600;color:var(--text2);margin-bottom:6px;display:block;}
input,select,textarea{width:100%;background:var(--bg3);border:1.5px solid var(--border);border-radius:var(--rs);color:var(--text);font-family:'DM Sans',sans-serif;font-size:16px;padding:13px 14px;outline:none;transition:border-color .2s;-webkit-appearance:none;appearance:none;}
input:focus,select:focus,textarea:focus{border-color:var(--accent);}
textarea{resize:vertical;min-height:70px;font-size:15px;}
.fr{display:flex;gap:10px;}.fr .fi{flex:1;}
.btn{width:100%;border:none;border-radius:var(--rs);padding:15px;font-family:'DM Sans',sans-serif;font-size:15px;font-weight:600;cursor:pointer;transition:opacity .15s;margin-top:6px;}
.btn:active{opacity:.8;}.btn-p{background:var(--accent);color:#fff;}.btn-g{background:var(--bg3);color:var(--text2);border:1px solid var(--border);}.btn-d{background:rgba(255,92,92,.15);color:var(--red);border:1px solid rgba(255,92,92,.3);}
.btn-sm{background:var(--accent);color:#fff;border:none;border-radius:var(--rs);padding:11px 16px;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:600;cursor:pointer;}
.icon-btn{background:var(--accent);border:none;color:#fff;width:38px;height:38px;border-radius:50%;font-size:24px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;line-height:1;}
#app{display:none;min-height:100vh;}#app.on{display:block;}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:rgba(15,17,23,.96);backdrop-filter:blur(24px);border-top:1px solid var(--border);display:flex;padding:10px 0 calc(10px + var(--sb));z-index:100;}
.nb{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;color:var(--text3);cursor:pointer;font-family:'DM Sans',sans-serif;font-size:10px;font-weight:500;transition:color .2s;padding:4px 0;}
.nb.on{color:var(--accent);}.nb svg{width:22px;height:22px;}
.pg{display:none;padding-bottom:calc(80px + var(--sb));min-height:100vh;}.pg.on{display:block;}
.hd{padding:calc(var(--st) + 54px) 20px 14px;background:linear-gradient(180deg,var(--bg2) 0%,transparent 100%);position:sticky;top:0;z-index:50;backdrop-filter:blur(20px);}
.hd h1{font-size:28px;font-weight:700;letter-spacing:-.5px;}.hd p{color:var(--text2);font-size:13px;margin-top:2px;}
.hdr{display:flex;justify-content:space-between;align-items:flex-end;gap:8px;}
.ubadge{display:flex;align-items:center;gap:6px;background:var(--bg3);border:1px solid var(--border);border-radius:20px;padding:6px 12px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;flex-shrink:0;}
.stitle{font-size:11px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--text3);margin:20px 0 10px;}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:16px;margin-bottom:10px;position:relative;overflow:hidden;cursor:pointer;transition:transform .15s,border-color .15s;}
.card:active{transform:scale(.98);border-color:var(--accent);}.cacc{position:absolute;left:0;top:0;bottom:0;width:3px;}
.badge{font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;white-space:nowrap;}
.ba{background:rgba(34,201,122,.1);color:var(--amperus);}.bw{background:rgba(255,92,92,.1);color:var(--waat);}.bd{background:rgba(255,255,255,.06);color:var(--text2);}.bm{background:rgba(124,92,252,.15);color:var(--purple);}
.camts{display:flex;gap:8px;}.ab{flex:1;background:var(--bg3);border-radius:var(--rs);padding:8px 10px;}.al{font-size:10px;color:var(--text3);margin-bottom:2px;}.av{font-size:14px;font-weight:600;font-family:'DM Mono',monospace;}.av.g{color:var(--green);}.av.r{color:var(--red);}
.krow{display:flex;gap:10px;margin-bottom:8px;}.kcard{flex:1;background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:14px 12px;}.kl{font-size:10px;color:var(--text3);margin-bottom:4px;font-weight:500;}.kv{font-size:18px;font-weight:700;font-family:'DM Mono',monospace;}.kv.a{color:var(--accent);}.kv.g{color:var(--green);}.kv.o{color:var(--orange);}
.cw{margin-bottom:6px;}.cwl{font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:1px;margin:18px 0 10px;}
.cd{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);margin-bottom:8px;overflow:hidden;}
.cdh{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--border);}
.cdn{font-size:22px;font-weight:700;font-family:'DM Mono',monospace;}.cdn.today{background:var(--accent);color:#fff;border-radius:8px;padding:2px 10px;}
.cdname{font-size:12px;color:var(--text2);font-weight:500;flex:1;}.cde{padding:10px 14px;color:var(--text3);font-size:13px;font-style:italic;}
.ce{padding:10px 14px;border-top:1px solid var(--border);display:flex;gap:10px;align-items:flex-start;}.ce.clickable{cursor:pointer;}.ce.clickable:active{background:var(--bg3);}
.cdot{width:8px;height:8px;border-radius:50%;margin-top:5px;flex-shrink:0;}.ci{flex:1;}.ctech{font-size:11px;font-weight:700;margin-bottom:2px;}.caddr{font-size:12px;color:var(--text2);line-height:1.4;}.ccli{font-size:11px;font-weight:600;margin-top:3px;}
.absent-tag{display:inline-block;font-size:10px;font-weight:700;padding:2px 7px;border-radius:10px;margin-left:6px;}.absent-tag.abs{background:rgba(255,92,92,.2);color:var(--red);}.absent-tag.cng{background:rgba(255,159,67,.2);color:var(--orange);}
.dep-item{display:flex;align-items:center;gap:8px;padding:9px 12px;background:var(--bg3);border-radius:var(--rs);margin-bottom:6px;border:1px solid var(--border);}
.dep-info{flex:1;}.dep-desc{font-size:13px;font-weight:500;}.dep-date{font-size:11px;color:var(--text3);margin-top:1px;}
.dep-amt{font-size:14px;font-weight:700;font-family:'DM Mono',monospace;color:var(--orange);white-space:nowrap;}
.dep-del{background:none;border:none;color:var(--text3);cursor:pointer;padding:4px;font-size:16px;flex-shrink:0;}
.dep-total{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:rgba(255,159,67,.1);border:1px solid rgba(255,159,67,.25);border-radius:var(--rs);margin-top:4px;}
.abs-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:14px;margin-bottom:8px;}
.abs-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}.abs-name{font-size:15px;font-weight:700;}
.abs-item{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--border);font-size:13px;}.abs-item:last-child{border-bottom:none;}
.mo{display:none;position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.75);backdrop-filter:blur(6px);align-items:flex-end;justify-content:center;}.mo.on{display:flex;}
.m{width:100%;max-width:430px;background:var(--bg2);border-radius:24px 24px 0 0;border-top:1px solid var(--border);max-height:94vh;overflow-y:auto;padding:20px 16px calc(24px + var(--sb));animation:su .3s cubic-bezier(.34,1.56,.64,1);}
@keyframes su{from{transform:translateY(100%);}to{transform:translateY(0);}}
.mh{width:36px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 22px;}.mt{font-size:20px;font-weight:700;margin-bottom:18px;}
.toast{position:fixed;top:calc(var(--st) + 54px);left:50%;transform:translateX(-50%);padding:10px 22px;border-radius:20px;font-size:14px;font-weight:600;z-index:400;opacity:0;transition:opacity .3s;white-space:nowrap;pointer-events:none;}
.toast.on{opacity:1;}.toast.ok{background:var(--green);color:#fff;}.toast.err{background:var(--red);color:#fff;}
.pad{padding:0 16px;}
.sync-dot{width:8px;height:8px;border-radius:50%;background:var(--green);display:inline-block;margin-left:6px;animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}
.exp-row{display:flex;gap:8px;margin-bottom:12px;}
.exp-btn{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--rs);padding:11px 10px;color:var(--text2);font-family:'DM Sans',sans-serif;font-size:13px;font-weight:600;cursor:pointer;}
</style>
</head>
<body>
<div class="toast" id="toast"></div>
<div id="login">
  <div class="logo">Kali<span>sma</span></div>
  <div class="logo-sub">Gestion des chantiers · Temps réel</div>
  <div class="lcard">
    <div class="ltitle">Connexion</div>
    <div class="fi"><label class="fl">Identifiant</label><input id="lu" type="text" placeholder="Votre prénom" autocomplete="username" autocapitalize="none" autocorrect="off"></div>
    <div class="fi"><label class="fl">Mot de passe</label><input id="lp" type="password" placeholder="••••••••" autocomplete="current-password"></div>
    <button class="btn btn-p" onclick="doLogin()">Se connecter</button>
    <div class="lerr" id="lerr">Identifiant ou mot de passe incorrect</div>
  </div>
  <div style="margin-top:16px;font-size:11px;color:var(--text3);text-align:center;"><span class="sync-dot"></span> Synchronisation Firebase temps réel</div>
</div>
<div id="app">
  <div class="pg on" id="pg-planning">
    <div class="hd"><div class="hdr"><div><h1>Planning</h1><p>Chantiers <span class="sync-dot"></span></p></div>
    <div style="display:flex;gap:8px;align-items:center;">
      <button class="icon-btn" id="btn-absence" onclick="openAbsenceModal()" style="display:none;background:var(--orange);font-size:16px;">🏖</button>
      <div class="ubadge" onclick="doLogout()"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg><span id="uname">—</span></div>
    </div></div></div>
    <div id="pl-body" class="pad"></div>
  </div>
  <div class="pg" id="pg-chantiers">
    <div class="hd"><div class="hdr"><div><h1>Chantiers</h1><p id="ch-count">—</p></div>
    <div style="display:flex;gap:8px;">
      <button class="icon-btn" id="btn-add-tech" onclick="openAddTechModal()" style="display:none;background:var(--purple);font-size:16px;">👷</button>
      <button class="icon-btn" id="btn-add" onclick="openAddChantier()" style="display:none;">+</button>
    </div></div></div>
    <div id="exp-row-container" class="pad" style="display:none;"><div class="exp-row" style="margin-top:12px;">
      <button class="exp-btn" onclick="exportCSV()"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>Export CSV</button>
      <button class="exp-btn" onclick="exportICS()"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>Agenda ICS</button>
    </div></div>
    <div id="ch-list" class="pad" style="margin-top:8px;"></div>
  </div>
  <div class="pg" id="pg-synthese">
    <div class="hd"><h1>Synthèse</h1><p>Vue financière & absences</p></div>
    <div id="sy-body" class="pad"></div>
  </div>
  <nav class="nav">
    <button class="nb on" id="nb-planning" onclick="goPage('planning',this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>Planning</button>
    <button class="nb" id="nb-chantiers" onclick="goPage('chantiers',this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>Chantiers</button>
    <button class="nb" id="nb-synthese" onclick="goPage('synthese',this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>Synthèse</button>
  </nav>
</div>
<div class="mo" id="mo-detail"><div class="m"><div class="mh"></div><div id="mo-detail-body"></div></div></div>
<div class="mo" id="mo-chantier"><div class="m"><div class="mh"></div><div class="mt" id="mo-chantier-title">Nouveau chantier</div>
  <div class="fr"><div class="fi"><label class="fl">Client</label><select id="f-client"><option>Amperus</option><option>Waat</option><option>Interne</option></select></div>
  <div class="fi"><label class="fl">Assigné à</label><select id="f-tech"></select></div></div>
  <div class="fi"><label class="fl">Nature des travaux</label><select id="f-nature-sel" onchange="toggleNature()"><option>Travaux d'infra</option><option>Travaux préparatoires</option><option>Travaux préparatoires ENEDIS</option><option>Travaux préparatoires WAATCO</option><option>Finition chantier</option><option>Rendez-vous client</option><option>Rendez-vous chantier</option><option>Récupération matériel</option><option value="autre">Autre…</option></select></div>
  <div class="fi" id="f-nature-other" style="display:none;"><label class="fl">Préciser</label><input id="f-nature-text" type="text" placeholder="Décrivez les travaux…"></div>
  <div class="fi"><label class="fl">Adresse / Site</label><input id="f-adresse" type="text" placeholder="10 rue Maria, 75001 Paris"></div>
  <div class="fr"><div class="fi"><label class="fl">Début</label><input id="f-debut" type="date"></div><div class="fi"><label class="fl">Fin</label><input id="f-fin" type="date"></div></div>
  <div class="fi"><label class="fl">Demi-journée</label><select id="f-demi"><option value="">Journée entière</option><option value="matin">Matin</option><option value="après-midi">Après-midi</option></select></div>
  <div class="fr"><div class="fi"><label class="fl">Facturé HT (€)</label><input id="f-facture" type="number" placeholder="0" step="0.01" inputmode="decimal"></div><div class="fi"><label class="fl">Heures MO</label><input id="f-heures" type="number" placeholder="8" step="0.5" inputmode="decimal"></div></div>
  <div class="fi"><label class="fl">Matériel (€)</label><input id="f-materiel" type="number" placeholder="0" step="0.01" inputmode="decimal"></div>
  <button class="btn btn-p" onclick="saveChantier()">Enregistrer</button>
  <button class="btn btn-g" onclick="closeModal('mo-chantier')">Annuler</button>
</div></div>
<div class="mo" id="mo-absence"><div class="m"><div class="mh"></div><div class="mt">Gérer une absence</div>
  <div class="fi"><label class="fl">Technicien</label><select id="abs-tech"></select></div>
  <div class="fi"><label class="fl">Type</label><select id="abs-type"><option value="absent">Absent (maladie / imprévu)</option><option value="conge">Congé</option></select></div>
  <div class="fr"><div class="fi"><label class="fl">Début</label><input id="abs-debut" type="date"></div><div class="fi"><label class="fl">Fin</label><input id="abs-fin" type="date"></div></div>
  <div class="fi"><label class="fl">Note (optionnel)</label><input id="abs-note" type="text" placeholder="Ex: maladie, RTT, vacances…"></div>
  <button class="btn btn-p" onclick="saveAbsence()">Enregistrer</button>
  <button class="btn btn-g" onclick="closeModal('mo-absence')">Annuler</button>
</div></div>
<div class="mo" id="mo-add-tech"><div class="m"><div class="mh"></div><div class="mt">Ajouter un technicien</div>
  <div class="fi"><label class="fl">Prénom / Nom</label><input id="new-tech-nom" type="text" placeholder="Ex: Ahmed" autocapitalize="words"></div>
  <div class="fi"><label class="fl">Taux horaire net (€/h)</label><input id="new-tech-taux" type="number" placeholder="13.20" step="0.01" inputmode="decimal"></div>
  <button class="btn btn-p" onclick="saveTechnicien()">Ajouter</button>
  <button class="btn btn-g" onclick="closeModal('mo-add-tech')">Annuler</button>
</div></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import{getDatabase,ref,set,push,remove,onValue,update}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
const FC={apiKey:"AIzaSyA7mDITGuOlWb5oLs-EYOdDyt30EbG1Dig",authDomain:"kalisma-prolec.firebaseapp.com",databaseURL:"https://kalisma-prolec-default-rtdb.europe-west1.firebasedatabase.app",projectId:"kalisma-prolec",storageBucket:"kalisma-prolec.firebasestorage.app",messagingSenderId:"160749414748",appId:"1:160749414748:web:1f03ad4e12551afa8c7999"};
const app=initializeApp(FC);const db=getDatabase(app);
const USERS={fousseni:{pass:'fousseni',role:'superadmin',nom:'Fousseni'},abdou:{pass:'abdou',role:'admin',nom:'Abdou'},fodie:{pass:'fodie',role:'admin',nom:'Fodie'},christophe:{pass:'christophe',role:'logistique',nom:'Christophe'},sekou:{pass:'sekou',role:'planning',nom:'Sékou'},kunda:{pass:'kunda',role:'technicien',nom:'KUNDA'},pape:{pass:'pape',role:'technicien',nom:'PAPE'}};
const CAN={superadmin:{chantiers:true,finances:true,edit:true,export:true,gererTech:true,absences:true},admin:{chantiers:true,finances:true,edit:true,export:false,gererTech:true,absences:true},logistique:{chantiers:true,finances:false,edit:false,export:false,gererTech:false,absences:false},planning:{chantiers:false,finances:false,edit:false,export:false,gererTech:false,absences:false},technicien:{chantiers:false,finances:false,edit:false,export:false,gererTech:false,absences:false}};
const NATURES=["Travaux d'infra","Travaux préparatoires","Travaux préparatoires ENEDIS","Travaux préparatoires WAATCO","Finition chantier","Rendez-vous client","Rendez-vous chantier","Récupération matériel"];
const MOIS=['Jan','Fév','Mar','Avr','Mai','Juin','Juil','Aoû','Sep','Oct','Nov','Déc'];
const JOURS=['Dim','Lun','Mar','Mer','Jeu','Ven','Sam'];

function ca(){return Object.entries(DB.chantiers).map(([k,v])=>({...v,_key:k}));}
function ta(){return Object.entries(DB.techniciens).map(([k,v])=>({...v,_key:k}));}
function aa(){return Object.entries(DB.absences||{}).map(([k,v])=>({...v,_key:k}));}
function gt(id){const t=DB.techniciens[id];return t?(t.taux||0):0;}
function cmo(c){return(c.heures||0)*gt(c.tech);}
function sd(c){return Object.values(c.depenses||{}).reduce((s,d)=>s+(d.montant||0),0);}
function td(c){return cmo(c)+(c.materiel||0)+sd(c);}
function mg(c){return(c.facture||0)-td(c);}
function eur(n){if(!n&&n!==0)return'—';return new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR',maximumFractionDigits:0}).format(n);}
function fd(s){if(!s)return'';return new Date(s+'T12:00:00').toLocaleDateString('fr-FR',{day:'numeric',month:'short'});}
function fdF(s){if(!s)return'';return new Date(s+'T12:00:00').toLocaleDateString('fr-FR',{day:'numeric',month:'short',year:'numeric'});}
function isT(s){const t=new Date(),d=new Date(s+'T12:00:00');return t.toDateString()===d.toDateString();}
function tc(id){const m={KUNDA:'var(--kunda)',PAPE:'var(--pape)',FOUSSENI:'var(--purple)',ABDOU:'var(--purple)',FODIE:'var(--purple)',CHRISTOPHE:'#aaa',SEKOU:'#aaa'};return m[id]||'var(--accent)';}
async function initDB(){
  onValue(ref(db,'techniciens'),s=>{if(!s.exists())set(ref(db,'techniciens'),DT);else DB.techniciens=s.val()||{};if(CU){rP();if(document.getElementById('pg-chantiers').classList.contains('on'))rC();if(document.getElementById('pg-synthese').classList.contains('on'))rS();}});
  onValue(ref(db,'chantiers'),s=>{if(!s.exists())DC.forEach(c=>push(ref(db,'chantiers'),c));else DB.chantiers=s.val()||{};if(CU){rP();if(document.getElementById('pg-chantiers').classList.contains('on'))rC();if(document.getElementById('pg-synthese').classList.contains('on'))rS();}});
  onValue(ref(db,'absences'),s=>{DB.absences=s.val()||{};if(CU){rP();if(document.getElementById('pg-synthese').classList.contains('on'))rS();}});
}
window.doLogin=function(){
  const u=document.getElementById('lu').value.trim().toLowerCase();
  const p=document.getElementById('lp').value.trim().toLowerCase();
  const usr=USERS[u];
  if(!usr||usr.pass!==p){document.getElementById('lerr').style.display='block';return;}
  CU={...usr,key:u};
  document.getElementById('lerr').style.display='none';
  document.getElementById('login').style.display='none';
  document.getElementById('app').classList.add('on');
  document.getElementById('uname').textContent=usr.nom;
  applyRole();rP();
};
window.doLogout=function(){
  if(!confirm('Se déconnecter ?'))return;
  CU=null;document.getElementById('app').classList.remove('on');document.getElementById('login').style.display='flex';
  document.getElementById('lu').value='';document.getElementById('lp').value='';
  document.querySelectorAll('.nb').forEach(b=>b.classList.remove('on'));document.getElementById('nb-planning').classList.add('on');
  document.querySelectorAll('.pg').forEach(p=>p.classList.remove('on'));document.getElementById('pg-planning').classList.add('on');
};

window.goPage=function(n,b){

function rP(){
  if(!CU)return;
  const isTech=CU.role==='technicien';
  let data=ca();if(isTech)data=data.filter(c=>c.tech===CU.nom.toUpperCase()||c.tech===CU.nom);
  const dates=new Set();
  data.forEach(c=>{let d=new Date(c.debut+'T12:00:00'),fn=new Date(c.fin+'T12:00:00');while(d<=fn){if(d.getDay()!==0&&d.getDay()!==6)dates.add(d.toISOString().slice(0,10));d.setDate(d.getDate()+1);}});
  aa().forEach(a=>{let d=new Date(a.debut+'T12:00:00'),fn=new Date(a.fin+'T12:00:00');while(d<=fn){if(d.getDay()!==0&&d.getDay()!==6)dates.add(d.toISOString().slice(0,10));d.setDate(d.getDate()+1);}});
  const sorted=[...dates].sort();
  if(!sorted.length){document.getElementById('pl-body').innerHTML='<div style="text-align:center;padding:60px 20px;color:var(--text3)">Aucune intervention planifiée</div>';return;}
  const weeks={};
  sorted.forEach(ds=>{const d=new Date(ds+'T12:00:00'),mon=new Date(d);mon.setDate(d.getDate()-(d.getDay()||7)+1);const wk=mon.toISOString().slice(0,10);if(!weeks[wk])weeks[wk]=[];if(!weeks[wk].includes(ds))weeks[wk].push(ds);});
  let html='';
  Object.entries(weeks).sort(([a],[b])=>a<b?-1:1).forEach(([wk,days])=>{
    const wd=new Date(wk+'T12:00:00'),we=new Date(wk+'T12:00:00');we.setDate(we.getDate()+4);
    html+='<div class="cw"><div class="cwl">Sem. du '+wd.getDate()+' '+MOIS[wd.getMonth()]+' → '+we.getDate()+' '+MOIS[we.getMonth()]+'</div>';
    days.forEach(ds=>{
      const d=new Date(ds+'T12:00:00');
      const entries=data.filter(c=>{const db=new Date(c.debut+'T12:00:00'),fn=new Date(c.fin+'T12:00:00');return d>=db&&d<=fn;});
      const absJ=aa().filter(a=>a.debut<=ds&&a.fin>=ds);
      html+='<div class="cd"><div class="cdh"><span class="cdn'+(isT(ds)?' today':'')+'">'+(d.getDate())+'</span><span class="cdname">'+JOURS[d.getDay()]+' '+MOIS[d.getMonth()]+(isT(ds)?" · Aujourd'hui":'')+'</span></div>';
      let hasC=false;
      absJ.forEach(a=>{hasC=true;const col=tc(a.tech);const tl=a.type==='conge'?'Congé':'Absent';const tcl=a.type==='conge'?'cng':'abs';html+='<div class="ce"><div class="cdot" style="background:'+col+'"></div><div class="ci"><div class="ctech" style="color:'+col+'">'+a.tech+' <span class="absent-tag '+tcl+'">'+tl+'</span></div>'+(a.note?'<div class="caddr">'+a.note+'</div>':'')+'</div></div>';});
      entries.forEach(c=>{hasC=true;const col=tc(c.tech);const cc=c.client==='Amperus'?'var(--amperus)':c.client==='Interne'?'var(--text3)':'var(--waat)';const dm=c.demi?' · '+c.demi:'';const ck=CAN[CU.role].chantiers||CAN[CU.role].edit;html+='<div class="ce'+(ck?' clickable':'')+'"'+(ck?' onclick="openDetail(\''+c._key+'\')"':'')+'>  <div class="cdot" style="background:'+col+'"></div><div class="ci">'+(!isTech?'<div class="ctech" style="color:'+col+'">'+c.tech+dm+'</div>':'')+'<div class="caddr">'+c.adresse+'</div><div class="ccli" style="color:'+cc+'">'+c.client+' · '+c.nature+'</div></div></div>';});
      if(!hasC)html+='<div class="cde">Aucune intervention</div>';
      html+='</div>';
    });
    html+='</div>';
  });
  document.getElementById('pl-body').innerHTML=html;
}

function rS(){
  if(!CU)return;
  const arr=ca();
  const tCA=arr.reduce((s,c)=>s+(c.facture||0),0);
  const tMg=arr.reduce((s,c)=>s+mg(c),0);
  const tDp=arr.reduce((s,c)=>s+td(c),0);
  let html='<div class="krow"><div class="kcard"><div class="kl">CA total HT</div><div class="kv a">'+eur(tCA)+'</div></div><div class="kcard"><div class="kl">Marge totale</div><div class="kv '+(tMg>=0?'g':'o')+'">'+eur(tMg)+'</div></div></div><div class="krow"><div class="kcard"><div class="kl">Dépenses</div><div class="kv o">'+eur(tDp)+'</div></div><div class="kcard"><div class="kl">Chantiers</div><div class="kv">'+arr.length+'</div></div></div>';

    const cc=arr.filter(c=>c.client===cli);
    const ca2=cc.reduce((s,c)=>s+(c.facture||0),0);const dp=cc.reduce((s,c)=>s+td(c),0);const mg2=cc.reduce((s,c)=>s+mg(c),0);
    const pct=tCA?ca2/tCA*100:0;const col=cli==='Amperus'?'var(--amperus)':'var(--waat)';

  const dah=d.edit?`<div class="stitle">Ajouter une dépense</div><div class="fr" style="margin-bottom:8px;"><div class="fi"><label class="fl">Date</label><input id="dep-date" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div class="fi"><label class="fl">Montant (€)</label><input id="dep-amt" type="number" placeholder="0" step="0.01" inputmode="decimal"></div></div><div class="fi" style="margin-bottom:8px;"><label class="fl">Description</label><input id="dep-desc" type="text" placeholder="Ex: Câble 4x16mm²…"></div><button class="btn-sm" style="width:100%;" onclick="addDepense('${key}')">+ Ajouter cette dépense</button>`:'';
  // Bloc contact
  let ch='';
  if(c.charge||c.contact||c.acces){
    ch='<div class="stitle">👤 Contact & accès</div><div style="background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);padding:14px;margin-bottom:8px;">';
    if(c.charge){ch+='<div style="margin-bottom:10px;"><div style="font-size:10px;color:var(--text3);margin-bottom:3px;font-weight:600;">CHARGÉ D\'AFFAIRES CLIENT</div><div style="font-size:14px;font-weight:600;">'+c.charge+'</div>'+(c.chargeTel?'<a href="tel:'+c.chargeTel+'" style="display:inline-flex;align-items:center;gap:6px;margin-top:4px;background:rgba(79,142,255,.15);color:var(--accent);padding:6px 12px;border-radius:20px;font-size:13px;font-weight:600;text-decoration:none;">📞 '+c.chargeTel+'</a>':'')+'</div>';}
    if(c.contact){ch+='<div style="margin-bottom:10px;"><div style="font-size:10px;color:var(--text3);margin-bottom:3px;font-weight:600;">CONTACT SUR SITE</div><div style="font-size:14px;font-weight:600;">'+c.contact+'</div>'+(c.contactTel?'<a href="tel:'+c.contactTel+'" style="display:inline-flex;align-items:center;gap:6px;margin-top:4px;background:rgba(34,201,122,.1);color:var(--green);padding:6px 12px;border-radius:20px;font-size:13px;font-weight:600;text-decoration:none;">📞 '+c.contactTel+'</a>':'')+'</div>';}
    if(c.acces){ch+='<div><div style="font-size:10px;color:var(--text3);margin-bottom:3px;font-weight:600;">🔑 ACCÈS</div><div style="font-size:13px;color:var(--text2);line-height:1.5;">'+c.acces+'</div></div>';}
    ch+='</div>';
  }
  document.getElementById('mo-detail-body').innerHTML='<div class="mt">'+c.nature+'</div><div style="color:var(--text2);font-size:13px;line-height:1.5;margin-bottom:14px;">'+c.adresse+'</div><div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px;"><span class="badge" style="background:rgba(79,142,255,.12);color:'+col+';">'+c.tech+'</span><span class="badge" style="background:rgba(34,201,122,.1);color:'+cc+';">'+c.client+'</span><span class="badge bd">'+fd(c.debut)+(c.debut!==c.fin?' → '+fd(c.fin):'')+'</span>'+(c.demi?'<span class="badge bm">'+c.demi+'</span>':'')+'</div>'+ch+eh+(d.edit?'<button class="btn btn-p" onclick="saveEdit(\''+key+'\')" style="margin-top:4px;">Enregistrer</button>':'')+rh+'<div class="stitle">📦 Journal des dépenses</div>'+dh+dah+(d.edit?'<button class="btn btn-d" onclick="confirmDel(\''+key+'\')" style="margin-top:16px;">Supprimer ce chantier</button>':'')+'<button onclick="closeModal(\'mo-detail\')" style="width:100%;background:none;border:none;color:var(--text3);padding:14px;font-family:DM Sans,sans-serif;font-size:14px;cursor:pointer;margin-top:6px;">Fermer</button>';
  document.getElementById('mo-detail').classList.add('on');
};
window.toggleNatureEdit=function(){const s=document.getElementById('e-nature'),b=document.getElementById('e-nature-other');if(s&&b)b.style.display=s.value==='autre'?'block':'none';};
window.saveEdit=async function(key){
  const c=DB.chantiers[key];if(!c)return;
  const ns=document.getElementById('e-nature').value;
  const nat=ns==='autre'?(document.getElementById('e-nature-text').value.trim()||c.nature):ns;
  await update(ref(db,'chantiers/'+key),{client:document.getElementById('e-client').value,tech:document.getElementById('e-tech').value,adresse:document.getElementById('e-adresse').value.trim()||c.adresse,nature:nat,debut:document.getElementById('e-debut').value,fin:document.getElementById('e-fin').value,demi:document.getElementById('e-demi').value||null,facture:parseFloat(document.getElementById('e-facture').value)||0,heures:parseFloat(document.getElementById('e-heures').value)||0,materiel:parseFloat(document.getElementById('e-materiel').value)||0,statut:document.getElementById('e-statut').value});
  closeModal('mo-detail');toast('✓ Chantier mis à jour');
};
window.confirmDel=async function(key){if(!confirm('Supprimer ?'))return;await remove(ref(db,'chantiers/'+key));closeModal('mo-detail');toast('Chantier supprimé');};
window.addDepense=async function(key){const desc=document.getElementById('dep-desc').value.trim();const amt=parseFloat(document.getElementById('dep-amt').value);const date=document.getElementById('dep-date').value;if(!desc||!amt||amt<=0){toast('⚠ Remplissez description et montant',true);return;}await push(ref(db,'chantiers/'+key+'/depenses'),{date,desc,montant:amt});toast('✓ Dépense ajoutée');setTimeout(()=>openDetail(key),300);};
window.delDepense=async function(k,dk){await remove(ref(db,'chantiers/'+k+'/depenses/'+dk));setTimeout(()=>openDetail(k),300);};
window.openAddChantier=function(){const today=new Date().toISOString().slice(0,10);document.getElementById('mo-chantier-title').textContent='Nouveau chantier';document.getElementById('f-debut').value=today;document.getElementById('f-fin').value=today;document.getElementById('f-adresse').value='';document.getElementById('f-facture').value='0';document.getElementById('f-heures').value='8';document.getElementById('f-materiel').value='0';document.getElementById('f-demi').value='';document.getElementById('f-nature-sel').value=NATURES[0];document.getElementById('f-nature-other').style.display='none';const sel=document.getElementById('f-tech');sel.innerHTML=ta().filter(t=>t.actif).map(t=>'<option value="'+t.id+'">'+t.nom+'</option>').join('');document.getElementById('mo-chantier').classList.add('on');};
window.toggleNature=function(){const s=document.getElementById('f-nature-sel'),b=document.getElementById('f-nature-other');if(s&&b)b.style.display=s.value==='autre'?'block':'none';};
window.saveChantier=async function(){const adr=document.getElementById('f-adresse').value.trim();if(!adr){toast('⚠ Adresse requise',true);return;}const ns=document.getElementById('f-nature-sel').value;const nat=ns==='autre'?(document.getElementById('f-nature-text').value.trim()||'Travaux'):ns;await push(ref(db,'chantiers'),{client:document.getElementById('f-client').value,adresse:adr,nature:nat,tech:document.getElementById('f-tech').value,debut:document.getElementById('f-debut').value,fin:document.getElementById('f-fin').value,demi:document.getElementById('f-demi').value||null,facture:parseFloat(document.getElementById('f-facture').value)||0,heures:parseFloat(document.getElementById('f-heures').value)||8,materiel:parseFloat(document.getElementById('f-materiel').value)||0,charge:document.getElementById('f-charge').value.trim(),chargeTel:document.getElementById('f-charge-tel').value.trim(),contact:document.getElementById('f-contact').value.trim(),contactTel:document.getElementById('f-contact-tel').value.trim(),acces:document.getElementById('f-acces').value.trim(),statut:'En cours',depenses:{}});closeModal('mo-chantier');toast('✓ Chantier ajouté');};
window.openAddTechModal=function(){document.getElementById('new-tech-nom').value='';document.getElementById('new-tech-taux').value='';document.getElementById('mo-add-tech').classList.add('on');};
window.saveTechnicien=async function(){const nom=document.getElementById('new-tech-nom').value.trim().toUpperCase();if(!nom){toast('⚠ Nom requis',true);return;}if(DB.techniciens[nom]){toast('⚠ Existe déjà',true);return;}const taux=parseFloat(document.getElementById('new-tech-taux').value)||0;await set(ref(db,'techniciens/'+nom),{id:nom,nom,taux,actif:true});closeModal('mo-add-tech');toast('✓ '+nom+' ajouté');};
window.openAbsenceModal=function(){const sel=document.getElementById('abs-tech');sel.innerHTML=ta().filter(t=>t.actif).map(t=>'<option value="'+t.id+'">'+t.nom+'</option>').join('');const today=new Date().toISOString().slice(0,10);document.getElementById('abs-debut').value=today;document.getElementById('abs-fin').value=today;document.getElementById('abs-note').value='';document.getElementById('mo-absence').classList.add('on');};
window.saveAbsence=async function(){const tech=document.getElementById('abs-tech').value;const type=document.getElementById('abs-type').value;const debut=document.getElementById('abs-debut').value;const fin=document.getElementById('abs-fin').value;const note=document.getElementById('abs-note').value.trim();if(!debut||!fin){toast('⚠ Dates requises',true);return;}await push(ref(db,'absences'),{tech,type,debut,fin,note});closeModal('mo-absence');toast('✓ Absence enregistrée');};
window.delAbsence=async function(key){if(!confirm('Supprimer ?'))return;await remove(ref(db,'absences/'+key));toast('Absence supprimée');};
window.exportCSV=function(){const arr=ca();const h=['Client','Adresse','Nature','Assigné','Début','Fin','Facturé HT','Heures MO','Coût MO','Matériel','Commandes','Total dépenses','Marge','Statut'];const rows=arr.map(c=>[c.client,c.adresse,c.nature,c.tech,c.debut,c.fin,(c.facture||0).toFixed(2),(c.heures||0).toFixed(1),cmo(c).toFixed(2),(c.materiel||0).toFixed(2),sd(c).toFixed(2),td(c).toFixed(2),mg(c).toFixed(2),c.statut].map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(';'));const csv=[h.map(x=>'"'+x+'"').join(';'),...rows].join('\n');const blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='kalisma_'+new Date().toISOString().slice(0,10)+'.csv';a.click();URL.revokeObjectURL(url);toast('✓ Export CSV');};
window.exportICS=function(){const arr=ca();let ics='BEGIN:VCALENDAR\nVERSION:2.0\nPRODID:-//Kalisma//FR\nCALSCALE:GREGORIAN\n';arr.forEach(c=>{const ds=c.debut.replace(/-/g,'');const de=(()=>{const d=new Date(c.fin+'T12:00:00');d.setDate(d.getDate()+1);return d.toISOString().slice(0,10).replace(/-/g,'');})();ics+='BEGIN:VEVENT\nUID:kalisma-'+c._key+'@kalisma\nDTSTART;VALUE=DATE:'+ds+'\nDTEND;VALUE=DATE:'+de+'\nSUMMARY:['+c.tech+'] '+c.nature+' – '+c.client+'\nLOCATION:'+c.adresse+'\nEND:VEVENT\n';});ics+='END:VCALENDAR';const blob=new Blob([ics],{type:'text/calendar;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='kalisma_planning.ics';a.click();URL.revokeObjectURL(url);toast('✓ ICS exporté');};
window.closeModal=function(id){document.getElementById(id).classList.remove('on');};
window.toast=function(msg,err=false){const t=document.getElementById('toast');t.textContent=msg;t.className='toast '+(err?'err':'ok')+' on';setTimeout(()=>t.classList.remove('on'),2400);};
document.querySelectorAll('.mo').forEach(o=>o.addEventListener('click',e=>{if(e.target===o)o.classList.remove('on');}));
document.getElementById('lp').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
initDB();
</script>
</body>
